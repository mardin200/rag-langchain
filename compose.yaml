
services:
  rag-langchain:
    build:
      context: .
      dockerfile: Dockerfile

    image: rag-langchain:phase3
    container_name: rag-langchain

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./chroma:/app/chroma

    restart: unless-stopped
