<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAG LangChain</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=2"
    >

</head>


<body>


<div class="container">


    <header>

        <h1>RAG LangChain</h1>

        <p>
            LangChain RAG Learning Project
        </p>

    </header>


    <!-- Knowledge Base -->

    <section class="panel">

        <h2>Knowledge Base</h2>

        <div class="upload-box">

            <input
                type="file"
                id="document-file"
                accept=".pdf,.docx,.txt,.md"
            >

            <button
                id="upload-button"
            >
                Upload Document
            </button>

            <div
                id="upload-status"
                class="status"
            ></div>

        </div>


        <div
            id="documents-list"
            class="documents-list"
        >

            Loading documents...

        </div>

    </section>


    <!-- Semantic Search -->

    <section class="panel">

        <h2>Semantic Search</h2>

        <div class="chat-input">

            <input
                type="text"
                id="search-query"
                placeholder="Search your documents..."
            >

            <button
                id="search-button"
            >
                Search
            </button>

        </div>


        <div
            id="search-results"
            class="search-results"
        ></div>

    </section>


    <!-- Chat -->

    <section class="panel">

        <h2>Chat</h2>

        <div
            id="chat-container"
            class="chat-container"
        >

            <div class="message assistant">

                <div class="message-content">

                    Ask a question about
                    your documents.

                </div>

            </div>

        </div>


        <div class="chat-input">

            <input
                type="text"
                id="chat-query"
                placeholder="Ask a question..."
            >

            <button
                id="chat-button"
            >
                Send
            </button>

        </div>

    </section>


    <!-- Evaluation -->

    <section class="panel">

        <h2>Evaluation</h2>

        <p>
            Evaluation features will be added
            in a later phase.
        </p>

    </section>


</div>


<script>


/* =========================================================
   Document Management
   ========================================================= */


const uploadButton =
    document.getElementById(
        "upload-button"
    );


const fileInput =
    document.getElementById(
        "document-file"
    );


const uploadStatus =
    document.getElementById(
        "upload-status"
    );


const documentsList =
    document.getElementById(
        "documents-list"
    );


async function loadDocuments() {

    documentsList.innerHTML =
        "Loading documents...";


    try {

        const response =
            await fetch(
                "/api/documents"
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Could not load documents."
            );

        }


        documentsList.innerHTML =
            "";


        if (
            result.documents.length === 0
        ) {

            documentsList.textContent =
                "No documents found.";

            return;

        }


        result.documents.forEach(
            (item) => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "document-item";


                element.innerHTML = `
                    <div>
                        <strong>
                            ${escapeHtml(
                                item.filename
                            )}
                        </strong>

                        <br>

                        <small>
                            ${item.file_type}
                            -
                            ${formatFileSize(
                                item.file_size
                            )}
                        </small>
                    </div>

                    <button
                        class="delete-button"
                        data-id="${escapeHtml(
                            item.document_id
                        )}"
                    >
                        Delete
                    </button>
                `;


                documentsList.appendChild(
                    element
                );

            }
        );


        document
            .querySelectorAll(
                ".delete-button"
            )
            .forEach(
                (button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteDocument(
                                button.dataset.id
                            );

                        }
                    );

                }
            );


    } catch (error) {

        documentsList.textContent =
            `Error: ${error.message}`;

    }

}


async function deleteDocument(
    documentId
) {

    const confirmed =
        confirm(
            "Delete this document?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/documents/${encodeURIComponent(
                    documentId
                )}`,
                {
                    method: "DELETE",
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Delete failed."
            );

        }


        await loadDocuments();


    } catch (error) {

        alert(
            `Error: ${error.message}`
        );

    }

}


uploadButton.addEventListener(
    "click",
    async () => {

        const file =
            fileInput.files[0];


        if (!file) {

            uploadStatus.textContent =
                "Please select a file.";

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        uploadStatus.textContent =
            "Uploading and indexing...";


        try {

            const response =
                await fetch(
                    "/api/documents/upload",
                    {
                        method: "POST",
                        body: formData,
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Upload failed."
                );

            }


            uploadStatus.textContent =
                `Indexed successfully. ` +
                `${result.chunks} chunks created.`;


            fileInput.value = "";


            await loadDocuments();


        } catch (error) {

            uploadStatus.textContent =
                `Error: ${error.message}`;

        }

    }
);


/* =========================================================
   Semantic Search
   ========================================================= */


const searchButton =
    document.getElementById(
        "search-button"
    );


const searchQuery =
    document.getElementById(
        "search-query"
    );


const searchResults =
    document.getElementById(
        "search-results"
    );


searchButton.addEventListener(
    "click",
    async () => {

        const query =
            searchQuery.value.trim();


        if (!query) {

            return;

        }


        searchResults.innerHTML =
            "Searching...";


        try {

            const response =
                await fetch(
                    `/api/search?q=${encodeURIComponent(
                        query
                    )}&k=4`
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Search failed."
                );

            }


            searchResults.innerHTML =
                "";


            if (
                result.results.length === 0
            ) {

                searchResults.textContent =
                    "No results found.";

                return;

            }


            result.results.forEach(
                (item, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "search-result";


                    const filename =
                        item.metadata?.filename ||
                        "Unknown source";


                    const page =
                        item.metadata?.page;


                    const pageText =
                        page !== undefined
                            ? ` - page ${page + 1}`
                            : "";


                    const score =
                        Number(
                            item.score
                        );


                    div.innerHTML = `
                        <h3>
                            Result ${index + 1}
                        </h3>

                        <p>
                            <strong>
                                Source:
                            </strong>

                            ${escapeHtml(
                                filename
                            )}

                            ${pageText}
                        </p>

                        <p>
                            <strong>
                                Score:
                            </strong>

                            ${Number.isFinite(score)
                                ? score.toFixed(4)
                                : "N/A"}
                        </p>

                        <p>
                            ${escapeHtml(
                                item.content
                            )}
                        </p>
                    `;


                    searchResults.appendChild(
                        div
                    );

                }
            );


        } catch (error) {

            searchResults.innerHTML =
                `Error: ${error.message}`;

        }

    }
);


/* =========================================================
   Chat
   ========================================================= */


const chatButton =
    document.getElementById(
        "chat-button"
    );


const chatQuery =
    document.getElementById(
        "chat-query"
    );


const chatContainer =
    document.getElementById(
        "chat-container"
    );


const chatHistory = [];


chatButton.addEventListener(
    "click",
    async () => {

        const query =
            chatQuery.value.trim();


        if (!query) {

            return;

        }


        const userMessage =
            document.createElement(
                "div"
            );


        userMessage.className =
            "message user";


        userMessage.innerHTML = `
            <div class="message-content">
                ${escapeHtml(query)}
            </div>
        `;


        chatContainer.appendChild(
            userMessage
        );


        chatQuery.value = "";


        const assistantMessage =
            document.createElement(
                "div"
            );


        assistantMessage.className =
            "message assistant";


        assistantMessage.innerHTML = `
            <div class="message-content">
                Thinking...
            </div>
        `;


        chatContainer.appendChild(
            assistantMessage
        );


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            {
                                query: query,
                                history: chatHistory
                            }
                        )
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Chat request failed."
                );

            }


            const messageContent =
                assistantMessage
                    .querySelector(
                        ".message-content"
                    );


            messageContent.innerHTML =
                `
                    <div class="answer">
                        ${escapeHtml(
                            result.answer
                        )}
                    </div>
                `;


            if (
                result.sources &&
                result.sources.length > 0
            ) {

                const sourcesDiv =
                    document.createElement(
                        "div"
                    );


                sourcesDiv.className =
                    "sources";


                const title =
                    document.createElement(
                        "strong"
                    );


                title.textContent =
                    "Sources";


                sourcesDiv.appendChild(
                    title
                );


                result.sources.forEach(
                    (source) => {

                        const sourceItem =
                            document.createElement(
                                "div"
                            );


                        sourceItem.className =
                            "source-item";


                        const pageText =
                            source.page !== null &&
                            source.page !== undefined
                                ? ` - page ${source.page}`
                                : "";


                        sourceItem.textContent =
                            `${source.filename}${pageText}`;


                        sourcesDiv.appendChild(
                            sourceItem
                        );

                    }
                );


                messageContent.appendChild(
                    sourcesDiv
                );

            }


            chatHistory.push(
                {
                    role: "user",
                    content: query,
                }
            );


            chatHistory.push(
                {
                    role: "assistant",
                    content: result.answer,
                }
            );


        } catch (error) {

            assistantMessage
                .querySelector(
                    ".message-content"
                )
                .textContent =
                    `Error: ${error.message}`;

        }

    }
);


/* =========================================================
   Utility Functions
   ========================================================= */


function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;

}


function formatFileSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return `${bytes} B`;

    }


    if (
        bytes < 1024 * 1024
    ) {

        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;

    }


    return `${(
        bytes /
        (1024 * 1024)
    ).toFixed(1)} MB`;

}


loadDocuments();


</script>


</body>

</html>
